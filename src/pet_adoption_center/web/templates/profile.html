{% extends "base.html" %}

{% block title %}My Profile - PawHaven{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-12">
  
  <div class="bg-white rounded-3xl p-8 sm:p-10 border border-slate-200/90 shadow-card">
    
    <div class="flex items-center space-x-4 border-b border-slate-100 pb-6 mb-6">
      <div class="w-16 h-16 rounded-2xl bg-amber-100 text-amber-800 font-extrabold text-2xl flex items-center justify-center border border-amber-300">
        {{ user.full_name[0] | upper }}
      </div>
      <div>
        <h1 class="text-2xl font-extrabold text-slate-900">{{ user.full_name }}</h1>
        <div class="flex items-center space-x-2 text-xs text-slate-500 mt-0.5">
          <span>@{{ user.username }}</span>
          <span>&bull;</span>
          <span class="capitalize font-semibold text-paw-700">{{ user.role }} Account</span>
        </div>
      </div>
    </div>

    <form method="POST" action="{{ url_for('profile') }}" class="space-y-4">
      <div>
        <label for="full_name" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Full Legal Name</label>
        <input type="text" id="full_name" name="full_name" value="{{ user.full_name }}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
      </div>

      <div>
        <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Email Address</label>
        <input type="email" id="email" name="email" value="{{ user.email }}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
      </div>

      <div>
        <label for="phone" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Phone Number</label>
        <input type="tel" id="phone" name="phone" value="{{ user.phone }}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
      </div>

      <div class="pt-4 flex justify-between items-center">
        <a href="{{ url_for('index') }}" class="text-xs font-semibold text-slate-500 hover:text-slate-800">
          &larr; Back to Home
        </a>
        <button type="submit" class="px-6 py-2.5 rounded-xl bg-slate-900 hover:bg-paw-600 text-white font-extrabold text-xs shadow-sm transition-colors">
          Update Profile
        </button>
      </div>
    </form>

  </div>

</div>
{% endblock %}
