{% extends "base.html" %}

{% block title %}Register Account - PawHaven{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  
  <div class="bg-white rounded-3xl p-8 sm:p-10 border border-slate-200/90 shadow-card">
    
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-teal-100 text-teal-700 flex items-center justify-center mx-auto text-2xl mb-3">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Create Adopter Account</h1>
      <p class="text-xs text-slate-500 mt-1">Join our rescue network to submit applications and save lives</p>
    </div>

    <!-- Registration Form -->
    <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
      <div>
        <label for="full_name" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Full Legal Name *</label>
        <input type="text" id="full_name" name="full_name" required placeholder="e.g. Jordan Smith" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-paw-500 text-sm">
      </div>

      <div>
        <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Email Address *</label>
        <input type="email" id="email" name="email" required placeholder="jordan@example.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-paw-500 text-sm">
      </div>

      <div>
        <label for="phone" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+1 (555) 012-3456" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-paw-500 text-sm">
      </div>

      <div>
        <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Choose Username *</label>
        <input type="text" id="username" name="username" required placeholder="jordansmith" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-paw-500 text-sm">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Password *</label>
          <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-paw-500 text-sm">
        </div>

        <div>
          <label for="confirm_password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Confirm *</label>
          <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-paw-500 text-sm">
        </div>
      </div>

      <button type="submit" class="w-full py-3.5 rounded-2xl bg-slate-900 hover:bg-paw-600 text-white font-extrabold text-sm shadow-md transition-colors mt-4">
        Complete Registration
      </button>
    </form>

    <div class="text-center mt-6 text-xs text-slate-500">
      Already registered? 
      <a href="{{ url_for('login') }}" class="font-bold text-paw-700 hover:text-paw-800">Sign in instead &rarr;</a>
    </div>

  </div>

</div>
{% endblock %}
